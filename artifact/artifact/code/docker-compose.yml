services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: duongan
      POSTGRES_PASSWORD: duongan
      POSTGRES_DB: duongan
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duongan"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql://duongan:duongan@db:5432/duongan
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      CONFIG_DIR: /config
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8000:8000"]
    volumes:
      - ./services/api/app:/srv/app
      - ./services/api/scripts:/srv/scripts
      - ./services/api/tests:/srv/tests
      - ./data:/data
      - ./config:/config
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  dbdata:
